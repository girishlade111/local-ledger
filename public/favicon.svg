<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Rounded Shield / Ledger Base -->
  <rect width="64" height="64" rx="16" fill="#166534" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#22c55e" stroke-opacity="0.3" stroke-width="2" />
  
  <!-- Receipt / Ledger Page -->
  <rect x="15" y="12" width="34" height="40" rx="4" fill="#ffffff" />
  
  <!-- Receipt Lines -->
  <line x1="21" y1="20" x2="35" y2="20" stroke="#166534" stroke-width="3" stroke-linecap="round" />
  <line x1="21" y1="27" x2="43" y2="27" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="21" y1="33" x2="39" y2="33" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="21" y1="39" x2="43" y2="39" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Checkmark / Seal Badge -->
  <circle cx="43" cy="44" r="10" fill="#22c55e" />
  <path d="M39.5 44L42 46.5L47 41.5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
